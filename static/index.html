<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的资源库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .card-img { height: 12rem; object-fit: cover; width: 100%; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex gap-2 mb-8">
            <input type="text" id="urlInput" placeholder="粘贴网页或视频链接..." class="flex-1 p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500">
            <button id="saveBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-bold transition">保存链接</button>
        </div>
        <p id="statusText" class="text-blue-400 mb-4 hidden">Karakeep 正在抓取中...</p>

        <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>
    </div>

    <script>
        const cardsContainer = document.getElementById('cardsContainer');
        const statusText = document.getElementById('statusText');
        const urlInput = document.getElementById('urlInput');
        const saveBtn = document.getElementById('saveBtn');

        // 延迟函数
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function loadCards() {
            try {
                const res = await fetch('/api/list');
                const { data } = await res.json();
                
                if (!data || data.length === 0) {
                    cardsContainer.innerHTML = '<p class="text-slate-500 col-span-full text-center">还没有收藏任何链接</p>';
                    return;
                }

                cardsContainer.innerHTML = data.map(item => `
                    <div class="bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700 flex flex-col">
                        ${item.image_url ? `<img src="${item.image_url}" class="card-img" onerror="this.style.display='none'">` : `<div class="card-img bg-slate-700 flex items-center justify-center text-4xl">🔗</div>`}
                        <div class="p-4 flex flex-col flex-1">
                            <h3 class="font-bold text-lg mb-2 line-clamp-2">${item.title}</h3>
                            <p class="text-sm text-slate-400 mb-4 line-clamp-2">${item.description || '无描述'}</p>
                            <div class="mt-auto">
                                <a href="${item.url}" target="_blank" class="block text-center bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-sm transition">查看原文</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("加载列表失败", e);
            }
        }

        saveBtn.onclick = async () => {
            const url = urlInput.value.trim();
            if (!url) return alert('请输入链接');

            saveBtn.disabled = true;
            saveBtn.innerText = '提交中...';
            statusText.classList.remove('hidden');
            statusText.innerText = 'Karakeep 正在抓取中... (预计等待 15-25 秒)';

            try {
                // 1. 触发抓取
                const res = await fetch('/api/save', {
                    method: 'POST',
                    body: JSON.stringify({ url })
                });
                const { bookmarkId } = await res.json();

                // 2. 第一次轮询：等待 15 秒
                await sleep(15000);
                let checkRes = await fetch(`/api/check-status?id=${bookmarkId}`);
                let checkData = await checkRes.json();

                if (checkData.status === 'success') {
                    finishSave();
                    return;
                }

                // 3. 第二次轮询：再等待 10 秒
                statusText.innerText = '还在处理中，再等 10 秒...';
                await sleep(10000);
                checkRes = await fetch(`/api/check-status?id=${bookmarkId}`);
                checkData = await checkRes.json();

                if (checkData.status === 'success') {
                    finishSave();
                } else {
                    // 两次都没成功，强制结束状态，刷新列表看看
                    statusText.innerText = '抓取时间较长，已尝试刷新列表';
                    setTimeout(() => finishSave(), 2000);
                }

            } catch (e) {
                alert('保存失败');
                resetButton();
            }
        };

        function finishSave() {
            statusText.classList.add('hidden');
            urlInput.value = '';
            resetButton();
            loadCards();
        }

        function resetButton() {
            saveBtn.disabled = false;
            saveBtn.innerText = '保存链接';
            statusText.classList.add('hidden');
        }

        loadCards();
    </script>
</body>
</html>
