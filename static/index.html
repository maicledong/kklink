    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        /* 图片区域：完整显示，深色背景填充留白 */
        .card-img-container {
            height: 12rem;
            width: 100%;
            background-color: #0f172a; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }
        .card-img:hover {
            transform: scale(1.05);
        }
        
        .toolbar-btn {
            @apply inline-flex items-center justify-center rounded-lg bg-slate-700 hover:bg-slate-600 text-white transition-colors px-4 py-2 text-sm font-medium whitespace-nowrap;
        }
        
        .search-input {
            @apply flex-1 p-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 transition-colors;
        }

        .card {
            @apply bg-slate-800 rounded-xl overflow-hidden flex flex-col transition-all duration-200 h-full w-full;
            border: 1px solid rgba(236, 72, 153, 0.5);
        }
        .card:hover {
            border-color: rgba(236, 72, 153, 1);
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.15);
        }
        
        .icon-btn {
            @apply inline-flex items-center justify-center w-9 h-9 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors;
        }
        #statusText {
            @apply text-blue-400 text-sm;
        }

@media (min-width: 1024px) {
/* 展开分类资源管理器时，修复左侧输入框被垂直拉伸的问题 */
#saveZone:has(#explorerView:not(.hidden)) #saveZoneMainRow {
    align-items: flex-start !important;
}
    

/* 展开时缩短分类按钮与输入框之间的距离 */
#saveZone:has(#explorerView:not(.hidden)) #scopeTabsWrapper {
    margin-bottom: 0 !important;
}

/* 展开时缩小保存区内部的纵向间距 */
#saveZone:has(#explorerView:not(.hidden)) {
    row-gap: 8px !important;
    height: auto !important;
    min-height: 0 !important;
}

/* 分类资源管理器动态高度 */
#saveZone:has(#explorerView:not(.hidden)) #explorerView {
    margin-top: -45px !important;
    margin-right: -1px !important;

    height: auto !important;
    max-height: 135px !important;
    min-height: 0 !important;

    align-self: flex-start !important;
}

/* 内部容器：向下延伸至保存区底边 */
#saveZone:has(#explorerView:not(.hidden)) #explorerView > div {
    height: auto !important;
    max-height: none !important;
    min-height: 0 !important;
    padding-bottom: 0 !important;
    margin-bottom: -18px !important;
}

/* 分类列表：填满延伸后的空间 */
#saveZone:has(#explorerView:not(.hidden)) #categoryTree {
    flex: 1 1 auto !important;
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    overflow-y: auto !important;
}


/* 分类资源管理器：缩小分类行间距和文字 */
#categoryTree .cat-row {
    padding-top: 0.8px !important;
    padding-bottom: 0.8px !important;
    line-height: 1rem !important;
}

/* 分类名称 */
#categoryTree .cat-name {
    font-size: 13px !important;
    line-height: 1.1rem !important;
}

/* 文件夹图标 */
#categoryTree .cat-row .text-sm {
    font-size: 13px !important;
}

/* 展开折叠箭头 */
#categoryTree .cat-toggle {
    font-size: 11px !important;
}

/* 右侧三个点菜单 */
#categoryTree .cat-more {
    font-size: 14px !important;
}
            
}

/* 缩小 Lists 标题与第一个分类之间的距离 */
#explorerView #categoryTree {
    margin-top: -5px !important;
}
			
            
/* 分类资源管理器：展开/折叠箭头 */
.tree-arrow {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    transition: transform 0.2s ease;
}

/* ==================================================
   分类资源管理器：去除黑色背景和边框
   ================================================== */

/* 去除资源管理器整体黑色背景 */
#explorerView {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

/* 去除分类管理器内部背景 */
#categoryTree {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

/* 去除分类管理器分页区域的背景和边框 */
#explorerView .pagination,
#explorerView .pagination-container,
#explorerView .page-controls {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

/* 去除分类管理器外层容器边框 */
#explorerView > div {
    border-color: transparent !important;
    box-shadow: none !important;
}
/* 资源管理器收起时，缩小主页/收藏/归档与输入框之间的距离 */
#saveZone:not(:has(#explorerView:not(.hidden))) {
    row-gap: 1px !important;
}

#saveZone:not(:has(#explorerView:not(.hidden))) #scopeTabsWrapper {
    margin-bottom: 0 !important;
}
/* ==================================================
   修复分类选择器被下方卡片遮挡
   ================================================== */

/* 提高整个链接保存区的层级 */
#saveZone {
    position: relative !important;
    z-index: 50 !important;
}

/* 确保分类选择器父级保持较高层级 */
#categoryPickerBtn {
    position: relative;
    z-index: 101;
}

/* 分类选择器下拉框 */
#categoryPickerDropdown {
    z-index: 99999 !important;
}
       
/* 让橙色展开按钮显示在蓝色分类选择按钮上方 */
#toggleSaveZoneBtn {
    z-index: 102 !important;
}

@media (max-width: 640px) {

    /* 链接保存区：左右不留内边距 */
    #saveZone {
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    /* 输入区域：左侧留 5px，右侧留 2px */
    #inputWrapper {
        width: auto !important;
        max-width: none !important;
        margin-left: 5px !important;
        margin-right: 2px !important;
        gap: 8px !important;
        box-sizing: border-box !important;
    }

    /* 左侧分类选择按钮不收缩 */
    #inputWrapper > .relative {
        flex-shrink: 0 !important;
    }

    /* 右侧输入框和保存按钮共用的灰色背景框 */
    #inputWrapper > div:last-child {
        flex: 1 1 0% !important;
        min-width: 0 !important;
        margin-right: 0 !important;
        box-sizing: border-box !important;
    }

    /* 保存按钮：蓝色背景右侧留出约5px空间 */
    #saveBtn {
        padding-left: 8px !important;
        padding-right: 8px !important;
        margin-right: 0px !important;
    }

    /* 手机端：Lists 展开时，保持上下两行间距不变 */
    #saveZone:has(#explorerView:not(.hidden)) {
        row-gap: 1px !important;
    }
	/* 手机端：缩短输入框与 Lists 之间的距离 */
    #saveZone:has(#explorerView:not(.hidden)) #saveZoneMainRow {
        row-gap: 5px !important;
    }

    /* 展开时取消主页、收藏、归档容器的底部外边距 */
    #saveZone:has(#explorerView:not(.hidden)) #scopeTabsWrapper {
        margin-bottom: 0 !important;
    }

	
}
			
            
            
    </style>

</div>

            </div>
                
            <p id="statusText" class="text-blue-400 mt-1 hidden text-center">正在抓取并转存 TG... 请耐心等待 40 秒</p>

        </div>

        <!-- 画廊工具栏 -->
        <div class="mb-5 space-y-3">
            <!-- 按钮排列 -->
            <div class="flex items-center gap-2 w-full h-10">
                <button class="toolbar-btn bg-indigo-600 hover:bg-indigo-500 w-10 h-full shrink-0" title="布局（待添加）">☰</button>
                
                <button class="toolbar-btn bg-slate-700 hover:bg-slate-600 flex-1 h-full" title="显示标签（待添加）">
                    <span class="mr-1">🏷️</span> 隐藏
                </button>
                
                <button class="toolbar-btn bg-slate-700 hover:bg-slate-600 flex-1 h-full flex items-center justify-center gap-2" title="操作（待添加）">
                    <svg viewBox="0 0 24 24" class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                    <span>全选</span>
                </button>

                <button class="toolbar-btn bg-purple-600 hover:bg-purple-500 w-10 h-full shrink-0" title="更多（待添加）">⋯</button>
            </div>
        </div>
        
        <!-- 卡片容器 -->
        <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 mt-4 items-stretch"></div>

        <!-- 分页条（替换为动态容器） -->
        <div id="paginationBar" class="flex justify-center items-center gap-2 mt-8 text-sm hidden"></div>
    </div>

    <!-- ================= 弹窗区 ================= -->
    <!-- 分类编辑弹窗 -->
    <div id="categoryEditModal" class="hidden fixed inset-0 bg-black/60 z-[100000] flex items-center justify-center p-4">
        <div class="bg-slate-800 rounded-xl p-6 w-full max-w-sm border border-slate-700">
            <h3 id="categoryEditTitle" class="text-lg font-bold mb-3 text-white">新建分类</h3>
            <p id="categoryEditParent" class="text-xs text-slate-400 mb-3"></p>
            <input type="text" id="categoryEditInput" placeholder="分类名称" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 mb-4">
            <div class="flex gap-3">
                <button id="categoryEditCancel" class="flex-1 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white">取消</button>
                <button id="categoryEditConfirm" class="flex-1 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium">确定</button>
            </div>
        </div>
    </div>

    <!-- 删除分类确认弹窗 -->
    <div id="categoryDeleteModal" class="hidden fixed inset-0 bg-black/60 z-[100000] flex items-center justify-center p-4">
        <div class="bg-slate-800 rounded-xl p-6 w-full max-w-sm border border-slate-700">
            <h3 class="text-lg font-bold mb-3 text-white">删除分类</h3>
            <p id="categoryDeleteMsg" class="text-sm text-slate-300 mb-4"></p>
            <div class="flex gap-3">
                <button id="categoryDeleteCancel" class="flex-1 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white">取消</button>
                <button id="categoryDeleteConfirm" class="flex-1 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white font-medium">确定删除</button>
            </div>
        </div>
    </div>

    <script>
        /* ============================================================
         * 核心状态与元素
         * ============================================================ */
        const cardsContainer = document.getElementById('cardsContainer');
        const statusText = document.getElementById('statusText');
        const urlInput = document.getElementById('urlInput');
        const saveBtn = document.getElementById('saveBtn');
        const paginationBar = document.getElementById('paginationBar');
        const searchInput = document.getElementById('searchKeyword');
        
        const ORACLE_DOMAIN = 'https://oracle.mcck.ccwu.cc';
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // 全局应用状态
        const AppState = {
            scope: 'home',          // home | fav | archive | category
            category: '',           // 当 scope === 'category' 时有效
            keyword: '',            // 搜索关键字
            page: 1,
            pageSize: 20,
            selectedIds: new Set(), // 选中的卡片 ID 集合
            isSelectAll: false,     // 当前页是否全选
            listData: []            // 当前页的数据缓存
        };

        /* ============================================================
         * 渲染列表
         * ============================================================ */
        async function loadCards() {
            // 显示加载中
            cardsContainer.innerHTML = '<p class="text-slate-500 col-span-full text-center py-12 animate-pulse">⏳ 加载中...</p>';
            paginationBar.classList.add('hidden');
            
            // 同步前端状态到 URL 参数
            let fetchUrl = `/api/list?scope=${AppState.scope}&page=${AppState.page}&pageSize=${AppState.pageSize}`;
            if (AppState.scope === 'category' && AppState.category) {
                fetchUrl += `&category=${encodeURIComponent(AppState.category)}`;
            }
            if (AppState.keyword) {
                fetchUrl += `&keyword=${encodeURIComponent(AppState.keyword)}`;
            }

            try {
                const res = await fetch(fetchUrl);
                const result = await res.json();
                
                if (!result.success) {
                    throw new Error(result.error || '获取列表失败');
                }

                AppState.listData = result.data || [];
                const totalPages = result.totalPages || 0;

                // 清空全选状态
                AppState.isSelectAll = false;
                AppState.selectedIds.clear();
                updateBatchToolbar();

                if (AppState.listData.length === 0) {
                    cardsContainer.innerHTML = '<p class="text-slate-500 col-span-full text-center py-12">还没有收藏任何链接</p>';
                    renderPagination(0, 0);
                    return;
                }

                // 渲染卡片
                cardsContainer.innerHTML = AppState.listData.map(item => {
                    const isAudio = (item.file_type || '').startsWith('audio/');
                    // 收藏与归档状态
                    const isFav = item.is_favorite === 1;
                    const isArchived = item.status === 'archived';

                    return `
                        <div class="card relative group" data-id="${item.id}">
                            <!-- 左上角复选框 -->
                            <div class="absolute top-2 left-2 z-10">
                                <input type="checkbox" class="card-checkbox w-5 h-5 rounded cursor-pointer accent-blue-500" data-id="${item.id}">
                            </div>
                            
                            <!-- 右上角悬浮操作栏 -->
                            <div class="absolute top-2 right-2 z-10 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button class="btn-fav bg-slate-900/80 hover:bg-slate-700 text-white p-1.5 rounded-lg backdrop-blur" title="${isFav ? '取消收藏' : '收藏'}">
                                    ${isFav ? '❤️' : '🤍'}
                                </button>
                                <button class="btn-archive bg-slate-900/80 hover:bg-slate-700 text-white p-1.5 rounded-lg backdrop-blur" title="${isArchived ? '取消归档' : '归档'}">
                                    ${isArchived ? '📦' : '🗃️'}
                                </button>
                                <button class="btn-move bg-slate-900/80 hover:bg-slate-700 text-white p-1.5 rounded-lg backdrop-blur" title="移动到分类">
                                    📁
                                </button>
                                <button class="btn-edit bg-slate-900/80 hover:bg-slate-700 text-white p-1.5 rounded-lg backdrop-blur" title="编辑">
                                    ✏️
                                </button>
                                <button class="btn-delete bg-slate-900/80 hover:bg-red-600 text-white p-1.5 rounded-lg backdrop-blur" title="删除">
                                    🗑️
                                </button>
                            </div>

                            <div class="card-img-container cursor-pointer" onclick="window.open('${item.url}', '_blank')">
                                ${item.image_url ? `
                                    <img src="${item.image_url}" class="card-img" referrerpolicy="no-referrer" 
                                        onerror="
                                            if('${item.img_file_id}' && !this.dataset.fallback) {
                                                this.dataset.fallback = '1'; 
                                                this.src = '${ORACLE_DOMAIN}/image/${item.img_file_id}';  
                                            } else { 
                                                this.style.display='none'; 
                                            }
                                        ">
                                ` : `<div class="text-4xl">🔗</div>`}
                            </div>
                            <div class="p-4 flex flex-col flex-1">
                                <h3 class="font-bold text-base mb-2 truncate text-white" title="${item.title || '无标题'}">${item.title || '无标题'}</h3>
                                <p class="text-xs text-slate-400 line-clamp-2 h-8 mb-4 leading-4">${item.description || '无描述'}</p>
                                
                                <div class="mt-auto flex gap-2">
                                    <a href="${item.url}" target="_blank" class="flex-1 text-center bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-sm transition-colors">查看原文</a>
                                    <a href="${item.url}" target="_blank" class="inline-flex items-center justify-center bg-orange-600 hover:bg-orange-500 px-3 py-2 rounded-lg text-sm transition-colors" title="下载/打开">⬇️</a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                // 渲染分页
                renderPagination(AppState.page, totalPages);

                // 绑定卡片上的单条操作事件
                bindCardEvents();

            } catch (e) {
                console.error("加载列表失败", e);
                cardsContainer.innerHTML = `<p class="text-red-400 col-span-full text-center py-8">加载失败：${e.message}</p>`;
            }
        }

        /* ============================================================
         * 分页渲染
         * ============================================================ */
        function renderPagination(current, total) {
            if (total <= 1) {
                paginationBar.classList.add('hidden');
                return;
            }
            paginationBar.classList.remove('hidden');

            let html = `
                <button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition-colors ${current <= 1 ? 'opacity-50 cursor-not-allowed' : ''}" 
                    onclick="if(${current} > 1) window.gotoPage(${current - 1})" ${current <= 1 ? 'disabled' : ''}>上一页</button>
            `;

            // 简单页码逻辑，最多显示 5 页
            let startPage = Math.max(1, current - 2);
            let endPage = Math.min(total, current + 2);

            if (startPage > 1) {
                html += `<button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white" onclick="window.gotoPage(1)">1</button>`;
                if (startPage > 2) html += `<span class="text-slate-500">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="px-3 py-1.5 rounded-lg border transition-colors ${i === current ? 'bg-blue-600 border-blue-600 text-white font-medium' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white hover:border-slate-500'}" onclick="window.gotoPage(${i})">${i}</button>`;
            }

            if (endPage < total) {
                if (endPage < total - 1) html += `<span class="text-slate-500">...</span>`;
                html += `<button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white" onclick="window.gotoPage(${total})">${total}</button>`;
            }

            html += `
                <button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition-colors ${current >= total ? 'opacity-50 cursor-not-allowed' : ''}" 
                    onclick="if(${current} < ${total}) window.gotoPage(${current + 1})" ${current >= total ? 'disabled' : ''}>下一页</button>
                <span class="text-slate-500 ml-2">共 ${total} 页</span>
            `;
            paginationBar.innerHTML = html;
        }

        window.gotoPage = function(page) {
            AppState.page = page;
            loadCards();
        };

        /* ============================================================
         * 批量操作与工具栏 (全选、批量移动/收藏/归档/删除)
         * ============================================================ */
        const selectAllBtn = document.querySelector('.toolbar-btn[title="操作（待添加）"]');
        // 重写全选按钮逻辑
        if (selectAllBtn) {
            selectAllBtn.title = "全选/反选";
            selectAllBtn.onclick = () => {
                AppState.isSelectAll = !AppState.isSelectAll;
                const checkboxes = document.querySelectorAll('.card-checkbox');
                checkboxes.forEach(cb => {
                    cb.checked = AppState.isSelectAll;
                    const id = Number(cb.dataset.id);
                    if (AppState.isSelectAll) {
                        AppState.selectedIds.add(id);
                        cb.closest('.card').classList.add('border-blue-500');
                    } else {
                        AppState.selectedIds.delete(id);
                        cb.closest('.card').classList.remove('border-blue-500');
                    }
                });
                updateBatchToolbar();
            };
        }

        // 监听单张卡片的复选框
        cardsContainer.addEventListener('change', (e) => {
            if (e.target.classList.contains('card-checkbox')) {
                const id = Number(e.target.dataset.id);
                if (e.target.checked) {
                    AppState.selectedIds.add(id);
                    e.target.closest('.card').classList.add('border-blue-500');
                } else {
                    AppState.selectedIds.delete(id);
                    e.target.closest('.card').classList.remove('border-blue-500');
                }
                updateBatchToolbar();
            }
        });

        function updateBatchToolbar() {
            const count = AppState.selectedIds.size;
            // 更新全选按钮的 UI
            if (selectAllBtn) {
                if (count === 0) {
                    selectAllBtn.innerHTML = `<svg viewBox="0 0 24 24" class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg><span>全选</span>`;
                    selectAllBtn.classList.replace('bg-purple-600', 'bg-slate-700');
                } else {
                    selectAllBtn.innerHTML = `<span>已选 ${count} 项</span>`;
                    selectAllBtn.classList.replace('bg-slate-700', 'bg-purple-600');
                }
            }
        }

        // 绑定批量操作按钮 (假设那个 "..." 按钮是批量操作下拉)
        const moreBtn = document.querySelector('.toolbar-btn[title="更多（待添加）"]');
        if (moreBtn) {
            moreBtn.title = "批量操作";
            moreBtn.onclick = (e) => {
                e.stopPropagation();
                if (AppState.selectedIds.size === 0) {
                    return alert('请先勾选需要操作的卡片');
                }
                showBatchActionMenu(moreBtn);
            };
        }

        function showBatchActionMenu(anchor) {
            // 先移除已有的
            document.getElementById('batchActionMenu')?.remove();
            
            const menu = document.createElement('div');
            menu.id = 'batchActionMenu';
            menu.className = 'absolute right-0 top-full mt-2 bg-slate-800 border border-slate-700 rounded-lg shadow-xl z-[9999] w-40 p-1';
            menu.innerHTML = `
                <button class="w-full text-left px-3 py-2 text-sm text-slate-200 hover:bg-slate-700 rounded" onclick="batchAction('move')">📁 批量移动</button>
                <button class="w-full text-left px-3 py-2 text-sm text-slate-200 hover:bg-slate-700 rounded" onclick="batchAction('favorite', 1)">❤️ 批量收藏</button>
                <button class="w-full text-left px-3 py-2 text-sm text-slate-200 hover:bg-slate-700 rounded" onclick="batchAction('favorite', 0)">🤍 取消收藏</button>
                <button class="w-full text-left px-3 py-2 text-sm text-slate-200 hover:bg-slate-700 rounded" onclick="batchAction('archive', 1)">🗃️ 批量归档</button>
                <button class="w-full text-left px-3 py-2 text-sm text-slate-200 hover:bg-slate-700 rounded" onclick="batchAction('archive', 0)">📂 取消归档</button>
                <div class="h-px bg-slate-700 my-1"></div>
                <button class="w-full text-left px-3 py-2 text-sm text-red-400 hover:bg-red-500/20 rounded" onclick="batchAction('delete')">🗑️ 批量删除</button>
            `;
            
            anchor.parentElement.style.position = 'relative';
            anchor.parentElement.appendChild(menu);

            setTimeout(() => {
                document.addEventListener('click', function closeMenu() {
                    menu.remove();
                    document.removeEventListener('click', closeMenu);
                }, { once: true });
            }, 0);
        }

        window.batchAction = async function(action, payloadVal) {
            document.getElementById('batchActionMenu')?.remove();
            const ids = Array.from(AppState.selectedIds);
            if (ids.length === 0) return;

            if (action === 'delete') {
                if (!confirm(`确定要删除选中的 ${ids.length} 个链接吗？不可恢复！`)) return;
            }

            const payload = {};
            if (action === 'favorite') payload.is_favorite = payloadVal;
            if (action === 'archive') payload.archived = payloadVal;

            if (action === 'move') {
                // 弹出分类选择器
                if (window.CategoryExplorer) {
                    // 借用 picker 树弹窗，我们需要在这里定义一个回调
                    const targetCat = prompt("请输入目标分类路径（如 /工作）：", "/default");
                    if (!targetCat) return;
                    payload.target_category = targetCat;
                } else {
                    return alert('分类组件未加载');
                }
            }

            try {
                const res = await fetch('/api/bookmark/batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids, action, payload })
                });
                const result = await res.json();
                if (result.success) {
                    alert(`操作成功，影响了 ${result.affected} 条数据`);
                    loadCards(); // 重新加载列表刷新状态
                } else {
                    alert('操作失败：' + result.error);
                }
            } catch (e) {
                console.error(e);
                alert('网络请求失败');
            }
        };

        /* ============================================================
         * 单卡片操作绑定 (收藏、归档、移动、编辑、删除)
         * ============================================================ */
        function bindCardEvents() {
            document.querySelectorAll('.card').forEach(cardEl => {
                const id = Number(cardEl.dataset.id);
                
                // 收藏
                cardEl.querySelector('.btn-fav')?.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const isFav = e.target.textContent.includes('❤️') ? 0 : 1;
                    await singleAction(id, 'favorite', { is_favorite: isFav });
                });

                // 归档
                cardEl.querySelector('.btn-archive')?.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const isArchived = e.target.textContent.includes('📦') ? 0 : 1;
                    await singleAction(id, 'archive', { archived: isArchived });
                });

                // 删除
                cardEl.querySelector('.btn-delete')?.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (confirm('确定删除此链接吗？')) {
                        await singleAction(id, 'delete');
                    }
                });

                // 编辑
                cardEl.querySelector('.btn-edit')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const item = AppState.listData.find(x => x.id === id);
                    if (!item) return;
                    
                    const newTitle = prompt('修改标题：', item.title);
                    if (newTitle === null) return;
                    const newDesc = prompt('修改描述：', item.description);
                    if (newDesc === null) return;

                    fetch('/api/bookmark/update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id, title: newTitle, description: newDesc })
                    }).then(r => r.json()).then(res => {
                        if (res.success) loadCards();
                        else alert(res.error);
                    });
                });

                // 移动
                cardEl.querySelector('.btn-move')?.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const targetCat = prompt("请输入要移动到的目标分类路径（如 /工作）：", "/default");
                    if (!targetCat) return;
                    await singleAction(id, 'move', { target_category: targetCat });
                });
            });
        }

        async function singleAction(id, action, payload = {}) {
            try {
                const res = await fetch('/api/bookmark/batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: [id], action, payload })
                });
                const result = await res.json();
                if (result.success) {
                    loadCards(); // 重新加载列表
                } else {
                    alert('操作失败：' + result.error);
                }
            } catch (e) {
                console.error(e);
                alert('网络错误');
            }
        }

        /* ============================================================
         * 搜索功能
         * ============================================================ */
        let searchTimer = null;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                AppState.keyword = e.target.value.trim();
                AppState.page = 1;
                loadCards();
            }, 400); // 400ms 防抖
        });

        const searchBtn = document.querySelector('.search-btn') || document.querySelectorAll('button[title="搜索"]')[0];
        if (searchBtn) {
            searchBtn.onclick = () => {
                AppState.keyword = searchInput.value.trim();
                AppState.page = 1;
                loadCards();
            };
        }
        
        const resetBtn = document.querySelector('button[title="重置"]');
        if (resetBtn) {
            resetBtn.onclick = () => {
                searchInput.value = '';
                AppState.keyword = '';
                AppState.page = 1;
                loadCards();
            };
        }

        /* ============================================================
         * 联动 CategoryExplorer (第 3 批的组件)
         * ============================================================ */
        // 切换顶部的 Scope (主页/收藏/归档/分类)
        window.onScopeChanged = (scope) => {
            AppState.scope = scope;
            AppState.page = 1;
            if (scope !== 'category') {
                AppState.category = '';
            }
            
            // 🌟 更新 Tab 的样式：文字高亮 + 下划线
            document.querySelectorAll('.scope-tab').forEach(b => {
                const isActive = b.dataset.scope === scope;
                b.classList.toggle('text-blue-500', isActive);
                b.classList.toggle('border-blue-500', isActive);
                b.classList.toggle('text-slate-400', !isActive);
                b.classList.toggle('border-transparent', !isActive);
            });

            loadCards();
        };

        // 点击左侧分类树
        window.onCategorySelected = (path) => {
            AppState.scope = 'category';
            AppState.category = path;
            AppState.page = 1;
            
            // 🌟 因为去掉了分类 Tab，点击分类树时，让所有顶部 Tab 都失去高亮
            document.querySelectorAll('.scope-tab').forEach(b => {
                b.classList.remove('text-blue-500', 'border-blue-500');
                b.classList.add('text-slate-400', 'border-transparent');
            });

            loadCards();
        };

        // 如果当前分类被删除了，退回主页
        window.onCategoryDeleted = (result) => {
            if (AppState.scope === 'category' && AppState.category === result.path) {
                window.CategoryExplorer.setScope('home');
            }
        };

        /* ============================================================
         * 保存链接 (修改 category_path 逻辑)
         * ============================================================ */
        saveBtn.onclick = async () => {
            const url = urlInput.value.trim();
            if (!url) return alert('请输入链接');

            saveBtn.disabled = true;
            saveBtn.classList.add('opacity-50');
            statusText.classList.remove('hidden');
            statusText.innerText = '正在抓取中... 请等待 40 秒';

            try {
                const saveRes = await fetch('/api/save', { method: 'POST', body: JSON.stringify({ url }) });
                const { bookmarkId } = await saveRes.json();

                await sleep(40000);
                
                let checkRes = await fetch(`/api/check-status?id=${bookmarkId}`);
                let checkData = await checkRes.json();

                if (checkData.status !== 'success') {
                    statusText.innerText = '抓取较慢，再等 15 秒...';
                    await sleep(15000);
                    checkRes = await fetch(`/api/check-status?id=${bookmarkId}`);
                    checkData = await checkRes.json();
                }

                if (checkData.status === 'success') {
                    statusText.innerText = '正在将封面图转存至 Telegram...';
                    const { url: targetUrl, title, description, imageUrl, karakeepLocalImage } = checkData.data;
                    let imgFileId = "";

                    if (karakeepLocalImage) {
                        try {
                            const proxyRes = await fetch(`${ORACLE_DOMAIN}/proxy-image?url=${encodeURIComponent(karakeepLocalImage)}`);
                            if (proxyRes.ok) {
                                const proxyData = await proxyRes.json();
                                if (proxyData.success) imgFileId = proxyData.file_id;
                            }
                        } catch (e) { console.error(e); }
                    }

                    statusText.innerText = '正在写入数据库...';
                    
                    // 获取当前选中的分类
                    const targetCategory = window.CategoryExplorer ? window.CategoryExplorer.getPickerPath() : '/default';

                    await fetch('/api/store', {
                        method: 'POST',
                        body: JSON.stringify({ 
                            url: targetUrl, 
                            title, 
                            description, 
                            imageUrl, 
                            imgFileId,
                            category_path: targetCategory // 🌟 带上分类路径
                        })
                    });

                    // 保存成功后重新加载列表
                    loadCards();
                } else {
                    alert("抓取超时，请稍后刷新查看");
                }

            } catch (e) {
                console.error(e);
                alert('保存过程出现异常');
            } finally {
                statusText.classList.add('hidden');
                urlInput.value = '';
                saveBtn.disabled = false;
                saveBtn.classList.remove('opacity-50');
            }
        };

        // 页面加载完成后初始化主页列表
        document.addEventListener('DOMContentLoaded', () => {
            loadCards();
        });
    </script>
    <!-- 引入分类资源管理器脚本 -->
    <script src="/category-explorer.js"></script>
</body>
</html>
