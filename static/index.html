/* 🌟 卡片整体样式（带有粉色圆角边框和悬浮发光） */
.card {
    @apply bg-slate-800 overflow-visible flex flex-col transition-all duration-200 h-full w-full;

    /* 卡片圆角 */
    border-radius: 12px !important;

    /* 粉色边框 */
    border: 2px solid rgba(236, 72, 153, 0.5);
}

/* 卡片标题：黄色、小字号、靠近卡片左侧 */
.card-title {
    color: #facc15 !important;
    font-size: 13px !important;
    line-height: 1.4 !important;
    font-weight: 600;

    /* 减少标题左右留白 */
    padding-left: 2px !important;
    padding-right: 2px !important;

    /* 保持左对齐 */
    text-align: left !important;

    /* 保留单行省略效果 */
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
			
        .card:hover {
            border-color: rgba(236, 72, 153, 1);
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.15); 
        }

        /* 当前打开菜单的卡片提高层级 */
        .card.menu-open {
            position: relative;
            z-index: 100;
        }

        /* 图片区域：高度 10rem，裁切填满，保留顶部圆角 */
        .card-img-container {
            height: 10rem;
            width: 100%;
            background-color: #0f172a; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 0.7rem 0.7rem 0 0;
        }
        
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
        }
        .card-img:hover {
            transform: scale(1.05);
        }
        
        /* 工具栏按钮 */
        .toolbar-btn {
            @apply inline-flex items-center justify-center rounded-lg bg-slate-700 hover:bg-slate-600 text-white transition-colors px-4 py-2 text-sm font-medium whitespace-nowrap;
        }
        
        /* 搜索框 */
        .search-input {
            @apply flex-1 p-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 transition-colors;
        }

        /* 图标按钮 */
        .icon-btn {
            @apply inline-flex items-center justify-center w-9 h-9 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors;
        }
        
        #statusText {
            @apply text-blue-400 text-sm;
        }

        /* 卡片右下角三个点菜单：向上展开 */
        .card-action-menu {
            position: absolute;
            bottom: 100%;
            right: -4px;
            width: 100px;
            margin-bottom: 2px;
            padding: 1px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
            z-index: 9999;
        }

        .card-action-menu button {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 4px;
            padding: 4px 5px;
            border-radius: 5px;
            color: #e2e8f0;
            font-size: 13px;
            text-align: left;
        }

        .card-action-menu button:hover {
            background: #334155;
        }

        .card-action-menu .menu-divider {
            height: 1px;
            background: #334155;
            margin: 1px 0;
        }

        .card-action-menu button.menu-delete {
            color: #f87171;
        }

        .card-action-menu button.menu-delete:hover {
            background: rgba(239, 68, 68, 0.15);
        }

        /* 卡片左下角域名 */
        .card-domain {
            display: block;
            min-width: 0;
            overflow: hidden;
            color: #64748b;
            font-size: 12px;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .card-domain:hover {
            color: #60a5fa;
        }

/* 右下角三个点图标 */
.card-more {
    flex-shrink: 0;
    width: 32px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    color: #64748b;
    font-size: 22px;
    line-height: 1;
    padding: 0;
    position: relative;
	background: transparent;
}

.card-more:hover {
    background: transparent;
    color: white;
}

/* 三个点使用 SVG，避免手机端字体基线导致位置偏下 */
.card-more svg {
    display: block;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
}

        /* 菜单里的图标尺寸限制 */
        .card-action-menu button .menu-icon {
            width: 20px;
            height: 20px;
            flex: 0 0 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .card-action-menu button .menu-icon svg {
            width: 16px;
            height: 16px;
        }




/* ==============================
   书签编辑面板
   ============================== */

.bookmark-edit-modal {
    position: fixed;
    inset: 0;
    z-index: 100000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, 0.65);
}

.bookmark-edit-panel {
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #020817;
    border: 1px solid #334155;
    border-radius: 12px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
}

.bookmark-edit-body {
    padding: 18px;
    overflow-y: auto;
    min-height: 0;
}

.bookmark-edit-field {
    margin-bottom: 16px;
}

.bookmark-edit-field label {
    display: block;
    margin-bottom: 7px;
    color: #f1f5f9;
    font-size: 14px;
    font-weight: 600;
}

.bookmark-edit-input,
.bookmark-edit-textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    color: #f8fafc;
    background: #0b1220;
    border: 1px solid #334155;
    border-radius: 7px;
    outline: none;
    font-size: 13px;
}

.bookmark-edit-input:focus,
.bookmark-edit-textarea:focus {
    border-color: #3b82f6;
}

.bookmark-edit-textarea {
    min-height: 80px;
    line-height: 1.6;
    overflow-y: auto;

    /* 允许上下调整高度，浏览器拖动把手默认在右下角 */
    resize: vertical;
}

.bookmark-edit-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 12px 18px;
    border-top: 1px solid #334155;
    background: #020817;
    flex-shrink: 0;
}

.bookmark-edit-btn {
    padding: 9px 18px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
}

.bookmark-edit-cancel {
    color: #e2e8f0;
    background: #1e293b;
}

.bookmark-edit-save {
    color: white;
    background: #2563eb;
}

.bookmark-edit-save:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
/* 确保 hidden 能正常隐藏编辑面板 */
.bookmark-edit-modal.hidden {
    display: none;
}

			

@media (max-width: 640px) {
    .bookmark-edit-modal {
        padding: 8px;
    }

    .bookmark-edit-panel {
        max-height: 94vh;
    }

    .bookmark-edit-body {
        padding: 14px;
    }
}

/* 显示设置：开关样式 */
.display-switch {
    appearance: none;
    -webkit-appearance: none;
    width: 30px;
    height: 17px;
    flex-shrink: 0;
    border-radius: 999px;
    background: #475569;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
}

.display-switch::before {
    content: "";
    position: absolute;
    width: 13px;
    height: 13px;
    left: 2px;
    top: 2px;
    border-radius: 50%;
    background: white;
    transition: transform 0.2s;
}

.display-switch:checked {
    background: #3b82f6;
}

.display-switch:checked::before {
    transform: translateX(13px);
    background: #0f172a;
}

const BookmarkCache = (() => {

	// ============================================================
    // 分类路径变更版本管理
    // 用于防止旧 /api/list 响应覆盖分类移动或重命名后的路径
    // ============================================================

// 当前分类路径变更版本
let categoryPathVersion = 0;

// 记录每次分类路径变化
// 旧请求返回时，根据请求发出时的版本，补上之后发生的路径变化
const categoryPathChanges = [];

// ============================================================
// 正在执行的 /api/list 请求登记
// ============================================================

// 请求 ID 递增计数器
let nextCategoryPathRequestId = 0;

// 正在执行的请求
// key：请求 ID
// value：请求开始时的分类路径版本
const activeCategoryPathRequests = new Map();


    // ---------- 基础辅助方法 ----------

    // 判断某个分类路径是否属于指定分类树
    function isInsideTree(path, rootPath) {
        return path === rootPath ||
            path.startsWith(rootPath + '/');
    }

    // ============================================================
    // 获取当前分类路径版本
    // ============================================================

    function getCategoryPathVersion() {
        return categoryPathVersion;
    }

// ============================================================
// 登记一个分类路径请求
// ============================================================

function beginCategoryPathRequest() {

    const requestId = ++nextCategoryPathRequestId;

    // 记录请求开始时的版本
    const requestVersion = categoryPathVersion;

    activeCategoryPathRequests.set(

function pruneCategoryPathChanges() {

    if (activeCategoryPathRequests.size === 0) {

    function makePageKey(state) {

    // ---------- 1. 收集删除前的书签信息 ----------
    for (const id of idList) {

        const key = String(id);

        const record =
            records.get(key) ||
            AppState.listData.find(
                item => String(item.id) === key
            );

        if (!record) {
            hasMissingRecord = true;
            continue;
        }

        // ---------- 2. 判断主页和归档页 ----------
        if (record.status === 'active') {
            affectedScopes.add('home');
        } else if (record.status === 'archived') {
            affectedScopes.add('archive');
        } else {
            hasMissingRecord = true;

        // ---------- 3. 判断收藏页 ----------
        if (Number(record.is_favorite) === 1) {
            affectedScopes.add('fav');
        }

        // ---------- 4. 收集原所属分类 ----------
        if (record.category_path) {
            affectedCategories.add(record.category_path);
        }
    }

    // ---------- 5. 精准失效相关分页缓存 ----------
    if (hasMissingRecord) {

        // 无法确定影响范围，保守失效所有分页
        invalidateAllPages();

    } else {

        // 一次遍历分页缓存，统一处理所有受影响的页面
        invalidatePages(entry => {

            // 所有关键词搜索缓存失效
            if (entry.keyword) {
                return true;
            }

            // 主页、收藏页、归档页
            if (affectedScopes.has(entry.scope)) {
                return true;
            }

            // 原所属分类
            if (
                entry.scope === 'category' &&
                affectedCategories.has(entry.category)
            ) {
                return true;
            }

            return false;
        });
    }

    // ---------- 6. 从共享记录中删除书签 ----------
    for (const id of idList) {
        records.delete(String(id));
    }
}

function prependToFirstPage(state, items) {

    if (!entry || entry.dirty) {
        return {
            updated: false,
            reason: 'cache-miss',
            added: 0
        };
    }

    // 合并新增记录，确保 records 中有完整书签数据
    const sharedItems = mergeRecords(items);

    const existingIds = new Set(entry.ids);
    const newIds = [];

    // 找出真正不在第一页缓存中的新增记录
    for (const item of sharedItems) {

        const id = String(item.id);

        if (existingIds.has(id)) continue;

        existingIds.add(id);
        newIds.push(id);
    }

    if (newIds.length === 0) {
        return {
            updated: false,
            reason: 'no-new-records',
            added: 0
        };
    }

    // 合并原有记录和新增记录
    entry.ids = [...newIds, ...entry.ids];


    // =====================================================
    // 按照数据库排序规则重新排列第一页缓存
    // ORDER BY created_at DESC, id DESC
    // =====================================================

    entry.ids.sort((idA, idB) => {

        const itemA = records.get(idA);
        const itemB = records.get(idB);

        // 缺少记录的 ID 放在最后
        if (!itemA) return itemB ? 1 : 0;
        if (!itemB) return -1;

        // 1. created_at 降序
        const timeA = String(itemA.created_at || '');
        const timeB = String(itemB.created_at || '');

        if (timeA !== timeB) {
            return timeA < timeB ? 1 : -1;
        }

        // 2. created_at 相同时，id 降序
        const numericIdA = Number(itemA.id);
        const numericIdB = Number(itemB.id);

        return numericIdB - numericIdA;
    });


    // 累计总记录数
    entry.total += newIds.length;


    // 根据第一页实际缓存数量计算溢出数量
    entry.overflowCount = Math.max(
        0,
        entry.ids.length - entry.pageSize
    );


    // 重新计算总页数
    if (entry.total > 0) {

            0,
            entry.total - entry.ids.length
        );

        entry.totalPages =
            1 + Math.ceil(
                remainingCount / entry.pageSize
            );

        entry.totalPages = 0;
    }

    invalidatePagesAfterFirst(firstPageState);


    return {
        updated: true,
        added: newIds.length,
        overflowCount: entry.overflowCount,
        total: entry.total,
        totalPages: entry.totalPages
    };
}



// ---------- 分类树操作 ----------

// 分类树重命名或移动时，同步更新缓存中的书签分类路径
function updateCategoryTree(oldPath, newPath) {

    let updatedCount = 0;

    // ============================================================
    // 1. 更新共享书签记录中的分类路径
    // ============================================================

    for (const item of records.values()) {

        const oldCategoryPath = item.category_path || '';

        if (!isInsideTree(oldCategoryPath, oldPath)) {
            continue;
        }

        item.category_path =
            newPath + oldCategoryPath.slice(oldPath.length);

        updatedCount++;
    }


    // ============================================================
    // 2. 更新分类分页缓存的分类路径
    // ============================================================

    const updatedPages = new Map();

    for (const entry of pages.values()) {

        if (
            entry.scope === 'category' &&
            isInsideTree(entry.category, oldPath)
        ) {

            entry.category =
                newPath + entry.category.slice(oldPath.length);
        }

        updatedPages.set(makePageKey(entry), entry);
    }

    // 重建分页缓存 Map
    pages.clear();

    for (const [key, entry] of updatedPages) {
        pages.set(key, entry);
    }


    // ============================================================
    // 3. 记录本次分类路径变化
    // ============================================================

    categoryPathVersion++;

    categoryPathChanges.push({
        version: categoryPathVersion,
        oldPath,
        newPath
    });

    pruneCategoryPathChanges();

    return updatedCount;

function removeCategoryTree(deletedPath, result = {}) {

    // ---------- 1. 获取后端统计结果 ----------

    const deletedBookmarks = Number(result.deleted_bookmarks) || 0;

    const deletedArchive = Number(result.deleted_archive) || 0;
    const deletedFavorites = Number(result.deleted_favorites) || 0;

    // ---------- 2. 收集并删除本地缓存中的书签记录 ----------

    for (const [id, item] of records) {
        const categoryPath = item.category_path || '';

        if (isInsideTree(categoryPath, deletedPath)) {
            deletedIds.add(String(id));
            records.delete(id);
        }
    }

    // 同时检查当前页面数据，避免共享 records 中没有对应记录
    // 但 AppState.listData 中仍然存在该书签的情况
    if (Array.isArray(AppState.listData)) {
        for (const item of AppState.listData) {
            const categoryPath = item.category_path || '';

            if (isInsideTree(categoryPath, deletedPath)) {
                deletedIds.add(String(item.id));
            }
        }

    // ---------- 3. 精准处理分页缓存 ----------

    for (const entry of pages.values()) {

        entry.ids = entry.ids.filter(
            id => !deletedIds.has(String(id))
        );

        // 3.1 关键词搜索缓存
        // 只要确实删除了书签，关键词缓存就失效
        if (deletedBookmarks > 0 && entry.keyword) {
            entry.dirty = true;
            continue;

            entry.scope === 'home' &&
            deletedHome > 0

            continue;

        if (
            entry.scope === 'fav' &&
            deletedFavorites > 0
        ) {
            entry.dirty = true;
            continue;
        }

        // 3.4 归档缓存
        if (
            entry.scope === 'archive' &&
            deletedArchive > 0
        ) {
            entry.dirty = true;
            continue;
        }

        if (
            entry.scope === 'category' &&

            entry.dirty = true;
            continue;
        }
    }

    updateBookmarkFavorite,
    updateBookmarkStatus,
    updateBookmarkCategory,

// 获取卡片标签
function getItemTags(item) {
    const raw = item.tags;

    if (!raw) return [];

    if (Array.isArray(raw)) {
        return raw.map(tag =>
            typeof tag === 'object' ? (tag.name || tag.label || '') : tag
        ).filter(Boolean);
    }

    if (typeof raw === 'string') {
        try {
            const parsed = JSON.parse(raw);

            if (Array.isArray(parsed)) {
                return parsed.map(tag =>
                    typeof tag === 'object' ? (tag.name || tag.label || '') : tag
                ).filter(Boolean);
            }
        } catch (e) {}

        return raw.split(/[,，]/).map(tag => tag.trim()).filter(Boolean);
    }

    return [];
}

// 手机端点击卡片标题，向左滚动显示完整文字
// ============================================================

document.addEventListener('click', function (e) {

    // 仅在手机端生效
    if (!window.matchMedia('(max-width: 767px)').matches) return;

    // 判断是否点击了卡片标题
    const title = e.target.closest('.card-title');
    if (!title) return;

    const wrapper = title.parentElement;

    // 计算标题超出容器的距离
    const distance = title.scrollWidth - wrapper.clientWidth;

    // 标题没有超出容器宽度时，不执行滚动
    if (distance <= 0) return;

    // 如果之前正在滚动，先取消之前的动画
    if (title._scrollAnimation) {
        title._scrollAnimation.cancel();
    }

// 从最前面滚动到最后，再返回最前面
title._scrollAnimation = title.animate(
    [
        { transform: 'translateX(0)' },
        { transform: `translateX(-${distance}px)`, offset: 0.85 },
        { transform: 'translateX(0)' }
    ],
    {
        duration: Math.max(3000, distance * 20),
        easing: 'linear',
        fill: 'none'
    }
);

});

		
		


async function loadCards() {

    cardsContainer.innerHTML = '<p class="text-slate-500 col-span-full text-center py-12 animate-pulse">⏳ 加载中...</p>';

    // 防止请求过程中用户切换了视图，旧请求又覆盖新视图
    const requestState = {
        scope: AppState.scope,
        category: AppState.category,
        keyword: AppState.keyword,
        page: AppState.page,
        pageSize: AppState.pageSize
    };

    const requestKey = BookmarkCache.makePageKey(requestState);


    try {

        let result = null;


        // ====================================================
        // 1. 优先读取本地书签缓存
        // ====================================================

        const cachedPage = BookmarkCache.getPage(requestState);

        if (cachedPage) {

            // 命中缓存，不请求 /api/list
            result = {
                success: true,
                data: cachedPage.data,
                total: cachedPage.total,
                totalPages: cachedPage.totalPages
            };

        } else {

            // ====================================================
            // 2. 缓存不存在或已经失效，才请求后端
            // ====================================================

            let fetchUrl =
                `/api/list?scope=${requestState.scope}` +
                `&page=${requestState.page}` +
                `&pageSize=${requestState.pageSize}`;

            if (
                requestState.scope === 'category' &&
                requestState.category
            ) {
                fetchUrl +=
                    `&category=${encodeURIComponent(requestState.category)}`;
            }

if (requestState.keyword) {
    fetchUrl +=
        `&keyword=${encodeURIComponent(requestState.keyword)}`;
}


// ====================================================
// 第一页发生溢出时，修正第二页及以后的 OFFSET
// ====================================================

if (requestState.page > 1) {

    // 获取当前列表对应的第一页状态
    const firstPageState = {
        ...requestState,
        page: 1
    };

    // 读取第一页缓存中的溢出数量
    const firstPageCache =
        BookmarkCache.getPage(firstPageState);

    const overflowCount =
        firstPageCache?.overflowCount || 0;

    // 只有第一页存在溢出时，才向后端传递参数
    if (overflowCount > 0) {
        fetchUrl += `&overflowCount=${overflowCount}`;
    }
}


// ====================================================
// 登记本次分类路径请求
// ====================================================

const categoryPathRequest =
    BookmarkCache.beginCategoryPathRequest();

try {

    // ====================================================
    // 请求后端列表
    // ====================================================

    const res = await fetch(fetchUrl);

    result = await res.json();

    if (!result.success) {
        throw new Error(result.error || '获取列表失败');
    }


    // ====================================================
    // 先修正旧请求返回的分类路径
    // ====================================================

    result.data = BookmarkCache.rebaseCategoryPaths(
        result.data || [],
        categoryPathRequest.version
    );

// ====================================================

// ====================================================

const categoryPathChanged =
    requestState.scope === 'category' &&

        requestState.category,
        categoryPathRequest.version
    );


// ====================================================

// ====================================================

if (categoryPathChanged) {

    // 分类路径已经变化：
    // 只合并共享书签记录，不再创建旧路径分页缓存
    result.data = BookmarkCache.mergeRecords(
        result.data || []
    );

} else {

}

         * 分页渲染
         * ============================================================ */
        function renderPagination(current, total) {
            if (total <= 1) {
                paginationBar.classList.add('hidden');
                return;
            }
            paginationBar.classList.remove('hidden');

            let html = `
                <button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition-colors ${current <= 1 ? 'opacity-50 cursor-not-allowed' : ''}" 
                    onclick="if(${current} > 1) window.gotoPage(${current - 1})" ${current <= 1 ? 'disabled' : ''}>上一页</button>
            `;

            // 简单页码逻辑，最多显示 5 页
            let startPage = Math.max(1, current - 2);
            let endPage = Math.min(total, current + 2);

            if (startPage > 1) {
                html += `<button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white" onclick="window.gotoPage(1)">1</button>`;
                if (startPage > 2) html += `<span class="text-slate-500">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="px-3 py-1.5 rounded-lg border transition-colors ${i === current ? 'bg-blue-600 border-blue-600 text-white font-medium' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white hover:border-slate-500'}" onclick="window.gotoPage(${i})">${i}</button>`;
            }

            if (endPage < total) {
                if (endPage < total - 1) html += `<span class="text-slate-500">...</span>`;
                html += `<button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white" onclick="window.gotoPage(${total})">${total}</button>`;
            }

            html += `
                <button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition-colors ${current >= total ? 'opacity-50 cursor-not-allowed' : ''}" 
                    onclick="if(${current} < ${total}) window.gotoPage(${current + 1})" ${current >= total ? 'disabled' : ''}>下一页</button>
                <span class="text-slate-500 ml-2">共 ${total} 页</span>
            `;
            paginationBar.innerHTML = html;
        }

        window.gotoPage = function(page) {
            AppState.page = page;
            loadCards();
        };

window.copySelectedLinks = async function () {
    const ids = Array.from(AppState.selectedIds);

    if (ids.length === 0) {
        showActionToast('请先选择要复制的链接');
        return;
    }

    const links = ids
        .map(id => AppState.listData.find(item => Number(item.id) === Number(id))?.url)
        .filter(url => url);

    if (links.length === 0) {
        showActionToast('没有找到选中项的链接');
        return;
    }

    try {
        await navigator.clipboard.writeText(links.join("\n"));

        document.getElementById("batchActionMenu")?.remove();

        showActionToast(`已复制 ${links.length} 个链接`);
    } catch (e) {
        showActionToast('复制失败，请检查浏览器剪贴板权限');
    }
};		


window.batchAction = async function(action, payloadVal) {
    document.getElementById('batchActionMenu')?.remove();

    const ids = Array.from(AppState.selectedIds);

    if (ids.length === 0) {
        return alert('请先勾选需要操作的卡片');
    }

    if (action === 'delete') {
        if (!confirm(`确定要删除选中的 ${ids.length} 个链接吗？不可恢复！`)) {
            return;
        }
    }

    const payload = {};

    if (action === 'favorite') {
        payload.is_favorite = payloadVal;
    }

    if (action === 'archive') {
        payload.archived = payloadVal;
    }

    if (action === 'move') {
        if (!window.CategoryExplorer) {
            return alert('分类组件未加载');
        }

        const targetCat = await window.CategoryExplorer.chooseMoveCategory();

        if (!targetCat) return;

        payload.target_category = targetCat;
    }

    // 移动之前，记录每条书签原来的分类路径
    const oldCategoryMap = new Map();

    if (action === 'move') {
        for (const id of ids) {
            const item =
                BookmarkCache.records.get(String(id)) ||
                AppState.listData.find(
                    record => String(record.id) === String(id)
                );

            oldCategoryMap.set(
                String(id),
                item?.category_path || ''
            );
        }
    }

    try {
        const res = await fetch('/api/bookmark/batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids, action, payload })
        });

        const result = await res.json();

        if (result.success) {

            // ---------- 批量收藏 / 取消收藏 ----------
            if (action === 'favorite') {
                const isFavorite = Number(payload.is_favorite);

                // 更新所有书签的收藏状态
                for (const id of ids) {
                    BookmarkCache.updateBookmarkFavorite(
                        id,
                        isFavorite
                    );
                }

                // 收藏页成员可能发生变化
                BookmarkCache.invalidateScopes(['fav']);
            }

            // ---------- 批量归档 / 取消归档 ----------
            else if (action === 'archive') {
                const status = payload.archived
                    ? 'archived'
                    : 'active';

                // 更新所有书签的归档状态
                for (const id of ids) {
                    BookmarkCache.updateBookmarkStatus(
                        id,
                        status
                    );
                }

                // 主页和归档页成员发生变化
                BookmarkCache.invalidateScopes([
                    'home',
                    'archive'
                ]);
            }

            // ---------- 批量移动书签 ----------
            else if (action === 'move') {
                const failedCount = Number(result.failed_count || 0);

                if (failedCount === 0) {

                    // 全部移动成功，更新共享记录
                    for (const id of ids) {
                        BookmarkCache.updateBookmarkCategory(
                            id,
                            payload.target_category
                        );
                    }

                    // 收集所有受到影响的源分类和目标分类
                    const affectedPaths = new Set();

                    for (const oldPath of oldCategoryMap.values()) {
                        if (oldPath) {
                            affectedPaths.add(oldPath);
                        }
                    }

                    affectedPaths.add(payload.target_category);

                    // 只让受到影响的分类分页缓存失效
                    BookmarkCache.invalidateCategoryPaths(
                        Array.from(affectedPaths)
                    );

                } else {
                    // 部分移动失败时，后端没有提供具体成功的书签 ID，
                    // 无法准确判断哪些分类发生了变化，因此保守失效
                    BookmarkCache.invalidateCategoryPages();
                }
            }

// ---------- 删除书签 ----------
else if (action === 'delete') {

    // 根据删除前的书签信息，精准失效相关缓存
    // 批量删除只统一处理一次
    BookmarkCache.invalidateDeletedBookmark(ids);
}


				

            // ---------- 其他操作 ----------
            else {
                BookmarkCache.invalidateAllPages();
            }

            // ---------- 操作成功提示 ----------
            if (action === 'move') {
                showActionToast(
                    `移动完成：成功移动 ${result.success_count} 条，失败 ${result.failed_count} 条`
                );
            } else {
                alert(`操作成功，影响了 ${result.affected} 条数据`);
            }

            // 重新绘制当前列表，优先读取缓存
            loadCards();

        } else {
            alert('操作失败：' + result.error);
        }

    } catch (e) {
        console.error(e);
        alert('网络错误');
    }
};

async function singleAction(id, action, payload = {}) {
    try {
        const res = await fetch('/api/bookmark/batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: [id], action, payload })
        });

        const result = await res.json();

        if (result.success) {

            // ---------- 收藏 / 取消收藏 ----------
            if (action === 'favorite') {
                const isFavorite = Number(payload.is_favorite);

                // 更新共享书签记录
                BookmarkCache.updateBookmarkFavorite(id, isFavorite);
                BookmarkCache.invalidateScopes(['fav']);
            }

            // ---------- 归档 / 取消归档 ----------
            else if (action === 'archive') {
                const status = payload.archived
                    ? 'archived'
                    : 'active';

                // 更新共享书签记录
                BookmarkCache.updateBookmarkStatus(id, status);

                // 归档状态会改变主页和归档页的成员
                BookmarkCache.invalidateScopes(['home', 'archive']);
            }

            // ---------- 移动书签 ----------
else if (action === 'move') {
    const targetCategory = payload.target_category;

    // 在更新之前，先取得书签原来的分类
    const cachedItem =
        BookmarkCache.records.get(String(id)) ||
        AppState.listData.find(
            item => String(item.id) === String(id)
        );

    const sourceCategory = cachedItem?.category_path;

    // 更新共享书签记录
    BookmarkCache.updateBookmarkCategory(
        id,
        targetCategory
    );

    // 只让源分类和目标分类的缓存失效
    const affectedPaths = [
        sourceCategory,
        targetCategory
    ].filter(Boolean);

    if (affectedPaths.length > 0) {
        BookmarkCache.invalidateCategoryPaths(affectedPaths);
    } else {
        // 无法确定源分类时，采用保守处理
        BookmarkCache.invalidateCategoryPages();
    }
}

	// ---------- 删除书签 ----------
else if (action === 'delete') {

    // 精准失效该书签所属范围的缓存
    BookmarkCache.invalidateDeletedBookmark(id);
}

            // 其他操作暂时采用保守处理
            else {
                BookmarkCache.invalidateAllPages();
            }

            // 重新绘制当前列表，优先读取缓存
            loadCards();

        } else {
            alert('操作失败：' + result.error);
        }

    } catch (e) {
        console.error(e);
        alert('网络错误');
    }
}

function handleCategoryPathChanged(oldPath, newPath) {

    if (!oldPath || !newPath) return;

    // 1. 更新共享书签缓存及分类分页缓存
    BookmarkCache.updateCategoryTree(
        oldPath,
        newPath

    if (

        AppState.category =
            newPath + AppState.category.slice(oldPath.length);

    updateVisibleCategoryLabels();
}

 * 批量保存链接
 * 1. 批量检查 D1 重复链接
 * 2. 最多 3 个链接同时提交 Karakeep
 * 3. 最多 3 个链接同时检查抓取状态
 * 4. Oracle 图片转存最多 3 个并发

// ---------- 并发限制工具 ----------
function createSemaphore(limit) {

    let active = 0;
    const waiting = [];

    return async function run(task) {

        if (active >= limit) {
            await new Promise(resolve => waiting.push(resolve));
        }

        active++;

        try {
            return await task();

        } finally {

            active--;

            const next = waiting.shift();

            if (next) next();
        }
    };
}


// Oracle 图片转存最多 3 个并发
const withOracleImageLimit = createSemaphore(3);

// 新增书签后：更新主页和目标分类的第一页缓存
// ============================================================

function cacheNewBookmark(record, invalidateKeywordCache = true) {

    if (!record || !record.id) return;

    // ---------- 0. 按需让关键词搜索缓存失效 ----------
    if (invalidateKeywordCache) {
        BookmarkCache.invalidateKeywordPages();
    }

    const pageSize = Number(AppState.pageSize) || 20;

    // ---------- 1. 更新主页第一页缓存 ----------
    if (record.status !== 'archived') {

        const homeState = {
            scope: 'home',
            category: '',
            keyword: '',
            page: 1,
            pageSize
        };

        const homeResult = BookmarkCache.prependToFirstPage(
            homeState,
            [record]
        );

        // 如果主页第一页没有可用缓存，
        // 也要让第二页及以后的缓存失效
        if (!homeResult.updated) {
            BookmarkCache.invalidatePagesAfterFirst(homeState);
        }

		// 其他分页数量的主页缓存全部失效
        BookmarkCache.invalidateOtherPageSizes(homeState);
    }


    // ---------- 2. 更新目标分类第一页缓存 ----------
    const categoryPath = record.category_path;

    if (categoryPath) {

        const categoryState = {
            scope: 'category',
            category: categoryPath,
            keyword: '',
            page: 1,
            pageSize
        };

        const categoryResult = BookmarkCache.prependToFirstPage(
            categoryState,
            [record]
        );

        // 如果目标分类第一页没有可用缓存，
        // 也要让第二页及以后的缓存失效
        if (!categoryResult.updated) {
            BookmarkCache.invalidatePagesAfterFirst(categoryState);
        }

		// 其他分页数量的目标分类缓存全部失效
        BookmarkCache.invalidateOtherPageSizes(categoryState);
    }
}


		
async function saveCrawledBookmark(checkData, categoryPath, invalidateKeywordCache = true) {	

    const {
        url: finalUrl,
        title,
        description,
        imageUrl,
        karakeepLocalImage,
        karakeepId
    } = checkData.data;

    let imgFileId = '';

    // Oracle 图片转存，最多 3 个并发
    if (karakeepLocalImage) {

        try {

            await withOracleImageLimit(async () => {

                const proxyRes = await fetch(
                    `${ORACLE_DOMAIN}/proxy-image?url=${encodeURIComponent(karakeepLocalImage)}`
                );

                if (!proxyRes.ok) {
                    return;
                }

                const proxyData = await proxyRes.json();

                if (proxyData.success) {
                    imgFileId = proxyData.file_id || '';
                }
            });

        } catch (e) {

            console.error(
                '封面图转存失败：',
                finalUrl,
                e
            );
        }
    }


    // 写入 D1
    const storeRes = await fetch('/api/store', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            url: finalUrl,
            title,
            description,
            imageUrl,
            imgFileId,
            karakeepId,
            category_path: categoryPath
        })
    });

    let storeData = {};

    try {
        storeData = await storeRes.json();
    } catch (e) {
        throw new Error('数据库写入接口返回的数据格式错误');
    }

    if (!storeRes.ok || !storeData.success) {
        throw new Error(
            storeData.error ||
            `写入数据库失败，HTTP ${storeRes.status}`
        );
    }

// ---------- 新增书签后更新缓存 ----------
if (!storeData.duplicate && storeData.record) {

    cacheNewBookmark(
        storeData.record,
        invalidateKeywordCache
    );

} else if (!storeData.duplicate && !storeData.record) {

    // 兼容后端尚未返回完整记录的情况：
    // 无法精确插入缓存时，失效相关缓存，避免读取旧数据
    BookmarkCache.invalidateScopes(['home']);
    BookmarkCache.invalidateCategoryPaths([categoryPath]);

    // 按需失效关键词搜索缓存
    if (invalidateKeywordCache) {
        BookmarkCache.invalidateKeywordPages();
    }
}

    return storeData;
}


// ============================================================
// 手动重新检查超时任务
// 每次点击只检查一次，不调用 /api/save
// ============================================================

timeoutRetryPanel.addEventListener('click', async event => {

    const button = event.target.closest('button[data-bookmark-id]');

    if (!button) return;

    const bookmarkId = button.dataset.bookmarkId;

    const task = timeoutTasks.find(
        item => String(item.bookmarkId) === String(bookmarkId)
    );

    if (!task || task.checking) return;

    task.checking = true;

    saveTimeoutTasks();
    renderTimeoutTasks();

    try {

        // 只检查一次原来的 Karakeep 任务
        const checkRes = await fetch(
            `/api/check-status?id=${encodeURIComponent(bookmarkId)}`
        );

        if (!checkRes.ok) {
            throw new Error(
                `检查抓取状态失败，HTTP ${checkRes.status}`
            );
        }

        const checkData = await checkRes.json();

        // Karakeep 仍在抓取
        if (checkData.status !== 'success') {

            alert('该链接仍在抓取中，请稍后再手动检查。');

            task.checking = false;

            saveTimeoutTasks();
            renderTimeoutTasks();

            return;
        }


        // 抓取成功，转存图片并写入 D1
        const storeData = await saveCrawledBookmark(
            checkData,
            task.categoryPath
        );


        // 保存完成，移除超时记录
        timeoutTasks = timeoutTasks.filter(
            item => String(item.bookmarkId) !== String(bookmarkId)
        );

        saveTimeoutTasks();
        renderTimeoutTasks();


        // 只有真正新增书签才刷新列表
        if (!storeData.duplicate) {
            await loadCards();
        }

        alert(
            storeData.duplicate
                ? '检查成功，但该链接已经存在于数据库中。'
                : '重新检查成功，书签已保存。'
        );


    } catch (e) {

        console.error('手动重新检查失败：', bookmarkId, e);

        task.checking = false;

        saveTimeoutTasks();
        renderTimeoutTasks();

        alert(e.message || '重新检查失败，请稍后重试。');
    }
});

		


// ---------- 保存按钮 ----------
saveBtn.onclick = async () => {

    // 按行读取链接
    const rawLines = urlInput.value
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);

        return alert('请输入链接，每行一个');
    }


    // ---------- 检查 URL 格式 ----------
    const validUrls = [];
    let invalidCount = 0;

    for (const item of rawLines) {

        try {

            const parsed = new URL(item);

            if (
                parsed.protocol !== 'http:' &&
                parsed.protocol !== 'https:'
            ) {
                throw new Error('无效协议');
            }

            validUrls.push(item);

        } catch (e) {

            invalidCount++;
        }
    }

    if (validUrls.length === 0) {
        return alert('没有有效的链接，请检查输入内容');
    }


    // ---------- 去除本次输入中的重复链接 ----------
    const uniqueUrls = [...new Set(validUrls)];

    const inputDuplicateCount =
        validUrls.length - uniqueUrls.length;


    if (uniqueUrls.length > 20) {
        return alert('单次最多保存 20 个链接');
    }

    saveBtn.disabled = true;
    saveBtn.classList.add('opacity-50');

    statusText.classList.remove('hidden');
    statusText.innerText = '正在检查数据库中的重复链接...';


    let successCount = 0;
    let duplicateCount = 0;
    let failedCount = 0;
    let completedCount = 0;

    let shouldClearInput = false;


    // 更新进度
    function updateProgress(total) {

        statusText.innerText =
            `正在处理 ${completedCount}/${total} 个链接` +
            `（成功 ${successCount}，重复 ${duplicateCount}，失败 ${failedCount}）`;
    }


// ---------- 单个链接处理 ----------
async function processOne(targetUrl, categoryPath) {

    // 提前声明，确保发生超时时仍然可以保存 bookmarkId
    let bookmarkId = null;

    try {

        // 1. 提交 Karakeep
        const saveRes = await fetch('/api/save', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                url: targetUrl
            })
        });

        let saveData = {};

        try {
            saveData = await saveRes.json();
        } catch (e) {
            throw new Error('保存接口返回的数据格式错误');
        }

        if (
            !saveRes.ok ||
            !saveData.success ||
            !saveData.bookmarkId
        ) {
            throw new Error(
                saveData.error ||
                `提交链接失败，HTTP ${saveRes.status}`
            );
        }

        bookmarkId = saveData.bookmarkId;


        // 2. 先等待 40 秒，再检查抓取状态
        let checkData = null;

        await sleep(40000);


        // 最多检查 3 次
        for (let i = 0; i < 3; i++) {

            const checkRes = await fetch(
                `/api/check-status?id=${encodeURIComponent(bookmarkId)}`
            );

            if (!checkRes.ok) {
                throw new Error(
                    `检查抓取状态失败，HTTP ${checkRes.status}`
                );
            }

            try {
                checkData = await checkRes.json();
            } catch (e) {
                throw new Error('抓取状态接口返回的数据格式错误');
            }

            // 抓取完成
            if (checkData.status === 'success') {
                break;
            }

            // 尚未完成，等待 10 秒
            if (i < 2) {
                await sleep(10000);
            }
        }


        // 3. 超时：保存任务 ID，等待手动重新检查
        if (!checkData || checkData.status !== 'success') {

            addTimeoutTask(
                bookmarkId,
                targetUrl,
                categoryPath
            );

            throw new Error(
                '抓取超时，已保留任务，可稍后手动重新检查'
            );
        }


        // 4. 抓取成功，转存图片并写入 D1
		// 批量保存期间暂不扫描关键词缓存，留到整批结束后统一处理
        const storeData = await saveCrawledBookmark(
            checkData,
            categoryPath,
			false
        );


        // 5. 统计写入结果
        if (storeData.duplicate) {

            duplicateCount++;

        } else {

            successCount++;
        }


    } catch (e) {

        failedCount++;

        console.error(
            '单个链接保存失败：',
            targetUrl,
            e
        );

    } finally {

        completedCount++;
    }
}


    try {

        // ---------- 先统一检查 D1 重复链接 ----------
        const duplicateRes = await fetch(
            '/api/bookmarks/check-duplicates',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    urls: uniqueUrls
                })
            }
        );

        let duplicateData = {};

        try {
            duplicateData = await duplicateRes.json();
        } catch (e) {
            throw new Error('批量查重接口返回的数据格式错误');
        }

        if (!duplicateRes.ok || !duplicateData.success) {
            throw new Error(
                duplicateData.error ||
                `批量查重失败，HTTP ${duplicateRes.status}`
            );
        }


        // 已经存在于 D1 的链接
        const duplicateSet = new Set(
            duplicateData.duplicates || []
        );

        duplicateCount = duplicateSet.size;


        // 过滤掉已经保存过的链接
        const pendingUrls = uniqueUrls.filter(
            item => !duplicateSet.has(item)
        );


        // ---------- 获取本次保存使用的分类 ----------
        // 在批量任务开始前读取一次，保证整批链接使用同一个分类
        const targetCategory = window.CategoryExplorer
            ? window.CategoryExplorer.getPickerPath()
            : '/default';


        // 如果全部链接都已经存在，不再提交 Karakeep
        if (pendingUrls.length === 0) {

            shouldClearInput = true;

            const message =
                `处理完成：\n` +
                `保存成功：${successCount} 个\n` +
                `数据库已存在：${duplicateCount} 个\n` +
                `本次输入重复：${inputDuplicateCount} 个\n` +
                `无效链接：${invalidCount} 个\n` +
                `处理失败：${failedCount} 个`;

            alert(message);

            return;
        }


        // ---------- 最多 3 个链接同时处理 ----------
        statusText.innerText =
            `查重完成，准备处理 ${pendingUrls.length} 个链接...`;


        let nextIndex = 0;


        async function worker() {

            while (true) {

                const currentIndex = nextIndex++;

                if (currentIndex >= pendingUrls.length) {
                    return;
                }

                const targetUrl = pendingUrls[currentIndex];

                await processOne(
                    targetUrl,
                    targetCategory
                );

                updateProgress(pendingUrls.length);
            }
        }


        const workerCount = Math.min(3, pendingUrls.length);

        const workers = Array.from(
            { length: workerCount },
            () => worker()
        );


        await Promise.all(workers);


        // ---------- 所有链接处理完成 ----------
        shouldClearInput = true;


        // 只有真正新增了书签，才需要刷新列表
        if (successCount > 0) {
			// 整批只扫描一次关键词搜索缓存
            BookmarkCache.invalidateKeywordPages();

            statusText.innerText =
                '全部处理完成，正在刷新书签列表...';

            // 整批只刷新一次
            await loadCards();
        }


        // ---------- 最终统计 ----------
        const message =
            `批量处理完成：\n\n` +
            `保存成功：${successCount} 个\n` +
            `数据库已存在：${duplicateCount} 个\n` +
            `本次输入重复：${inputDuplicateCount} 个\n` +
            `无效链接：${invalidCount} 个\n` +
            `处理失败：${failedCount} 个`;

        alert(message);


    } catch (e) {

        console.error('批量保存过程出现异常：', e);

        alert(e.message || '批量保存过程出现异常');

    } finally {

        statusText.classList.add('hidden');

        if (shouldClearInput) {
            urlInput.value = '';
        }

        saveBtn.disabled = false;
        saveBtn.classList.remove('opacity-50');
    }
};


        // 页面加载完成后初始化主页列表
        document.addEventListener('DOMContentLoaded', () => {
            loadCards();
        });
    </script>
    <!-- 引入分类资源管理器脚本 -->
    <script src="/category-explorer.js"></script>
</body>
