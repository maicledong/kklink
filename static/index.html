<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>我的资源库 · 深色版</title>
    <link rel="icon" type="image/webp" href="https://imgr2.aitc.ccwu.cc/其他/ec0535ab-2390-480f-92d8-b4d353827203.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .card-img {
            height: 12rem;
            object-fit: cover;
            width: 100%;
            transition: transform 0.2s ease;
        }
        .card {
            @apply bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700 flex flex-col transition-all duration-200 hover:border-slate-500 hover:shadow-slate-900/50;
        }
        
        /* 参照样式：工具栏容器 */
        #galleryToolbar {
            @apply flex flex-col gap-3 mb-6;
        }
        
        /* 参照样式：搜索栏 */
        .search-bar {
            @apply flex items-center bg-slate-800 border border-slate-700 rounded-lg overflow-hidden w-full;
        }
        .search-input {
            @apply flex-1 bg-transparent p-3 text-white placeholder-slate-400 focus:outline-none;
        }
        .search-actions {
            @apply flex items-center bg-slate-700 rounded-r-lg overflow-hidden shrink-0;
        }
        .search-btn {
            @apply px-4 py-3 text-slate-200 hover:text-white hover:bg-slate-600 transition-colors focus:outline-none;
        }
        
        /* 参照样式：操作按钮行 (平均铺开) */
        .action-bar {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .action-btn {
            flex: 1; /* 核心：让这5个按钮平均分配宽度 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-6xl mx-auto">
        <!-- 顶部：标题栏 -->
        <div class="relative mb-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors" title="播放器（待添加）">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="10 8 16 12 10 16 10 8"></polygon>
                    </svg>
                </button>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight">我的资源库</h1>
            </div>
            <div class="flex items-center gap-2">
                <button class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors" title="更多应用（待添加）">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="19" cy="12" r="1"></circle>
                        <circle cx="5" cy="12" r="1"></circle>
                    </svg>
                </button>
                <button class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors" title="切换主题（待添加）">🌙</button>
            </div>
        </div>

        <!-- 链接保存区 -->
        <div class="bg-slate-800/80 backdrop-blur-sm rounded-2xl border border-slate-700 p-5 mb-6 shadow-xl">
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="urlInput" placeholder="粘贴网页或视频链接..." class="flex-1 p-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 transition-colors">
                <button id="saveBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-bold transition-colors whitespace-nowrap shadow-lg shadow-blue-600/20">
                    保存链接
                </button>
            </div>
            <p id="statusText" class="text-blue-400 text-sm mt-3 hidden">Karakeep 正在抓取并转存 TG... 请耐心等待 40 秒</p>
        </div>

        <!-- 🌟 核心修改区：参照样式的工具栏 -->
        <div id="galleryToolbar">
            <!-- 1. 搜索栏 -->
            <div class="search-bar">
                <input type="text" id="searchKeyword" placeholder="搜索标签、标题、文本、URL" class="search-input" />
                <div class="search-actions">
                    <button id="searchBtn" class="search-btn" title="搜索">🔍</button>
                    <button id="resetSearchBtn" class="search-btn" title="重置">
                        <svg viewBox="0 0 1024 1024" width="20" height="20" fill="currentColor">
                            <path d="M849 845.7H434.4c4.2-2.6 8.2-5.6 11.7-9.2l96.1-96.1c7 2.5 14.3 4.1 22 4.1 17.1 0 33.1-6.6 45.2-18.7l247.4-247.4c12.1-12.1 18.7-28.1 18.7-45.3 0-17.1-6.7-33.1-18.7-45.2L616.3 147.2c-24.9-24.9-65.5-24.9-90.5 0L278.4 394.6c-18.2 18.1-22.9 44.6-14.6 67.2L167.6 558c-24.9 24.9-25.8 64.7-1.9 88.6l191.8 191.8c2.7 2.7 5.7 5.2 8.9 7.3H174.2c-13.8 0-25 11.2-25 25s11.2 25 25 25H849c13.8 0 25-11.2 25-25-0.1-13.9-11.2-25-25-25zM313.7 429.9l247.4-247.4c2.7-2.8 6.4-4.1 10-4.1s7.2 1.4 9.9 4.1l240.6 240.6c2.7 2.7 4.1 6.2 4.1 9.9s-1.5 7.3-4.1 9.9L574.2 690.4c-5.3 5.3-14.6 5.3-19.9 0L313.7 449.8c-2.7-2.7-4.1-6.2-4.1-9.9 0-3.8 1.4-7.3 4.1-10z" fill="#44454A"></path>
                            <path d="M201 611.2c-4.4-4.4-3.5-12.6 1.9-18l91.8-91.9 208 208-91.8 91.8c-2.9 2.9-6.5 4.6-10.3 4.7-2.2 0.3-5.3-0.3-7.7-2.8L201 611.2z" fill="#F17B7B"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 2. 操作按钮行（5个按钮平均铺开） -->
            <div class="action-bar" id="normalActions">
                <button id="menuToggleBtn" class="action-btn" style="background: #4f46e5; color: white">☰</button>
                <button id="toggleTagsBtn" class="action-btn" style="background: #3b82f6; color: white">🏷️ 显示</button>
                <button id="refreshCurrentPageBtn" class="action-btn" style="background: #d4237a; color: white" title="刷新当前页">
                    <!-- 保持原有刷新图标，由于按钮变宽了，图标居中即可 -->
                    <svg viewBox="0 0 1024 1024" width="20" height="20" fill="currentColor">
                        <path d="M437.655552 498.432H361.009152c0-145.408 0-332.288 242.8416-484.608 6.3488-6.912 0-13.824-6.4-13.824-453.7344 76.1344-492.0832 408.4224-492.0832 498.432H28.669952c-25.6 0-38.4 27.6992-19.2 48.4864l185.344 249.1904a45.7728 45.7728 0 0 0 76.6976 0l185.344-249.1904c12.8-20.7872 0-48.4864-19.2-48.4864m581.632-62.3104l-185.344-249.1904a45.7728 45.7728 0 0 0-76.7488 0l-185.344 249.1904c-12.7488 20.7872 0 48.4864 19.2 48.4864h70.2976c0 145.408 0 332.288-242.8416 484.608-6.4 6.912 0 13.824 6.4 13.824 453.7344-76.1344 492.0832-408.4224 492.0832-498.432h76.6976c25.6 0 38.3488-27.6992 25.6-48.4864" fill="currentColor"></path>
                    </svg>
                </button>
                <button id="gallerySelectToggleBtn" class="action-btn" style="background: #4b5563; color: white">全选</button>
                <button id="batchMoreBtn" class="action-btn" style="background: #9333ea; color: white">⋯</button>
            </div>
        </div>

        <!-- 卡片容器 -->
        <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>

        <!-- 分页条（占位） -->
        <div class="flex justify-center items-center gap-2 mt-8 text-sm">
            <button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition-colors" disabled>上一页</button>
            <button class="px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium">1</button>
            <button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition-colors">2</button>
            <button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition-colors">下一页</button>
            <span class="text-slate-500 ml-2">共 2 页</span>
            <button class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition-colors">跳页</button>
        </div>
    </div>

    <!-- JavaScript 逻辑 -->
    <script>
        const cardsContainer = document.getElementById('cardsContainer');
        const statusText = document.getElementById('statusText');
        const urlInput = document.getElementById('urlInput');
        const saveBtn = document.getElementById('saveBtn');

        const ORACLE_DOMAIN = 'https://oracle.mcck.ccwu.cc';
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function loadCards() {
            try {
                const res = await fetch('/api/list');
                const { data } = await res.json();
                
                if (!data || data.length === 0) {
                    cardsContainer.innerHTML = '<p class="text-slate-500 col-span-full text-center py-12">还没有收藏任何链接</p>';
                    return;
                }

                cardsContainer.innerHTML = data.map(item => `
                    <div class="card">
                        ${item.image_url ? `
                            <img src="${item.image_url}" class="card-img" referrerpolicy="no-referrer" 
                                onerror="
                                    if('${item.img_file_id}' && !this.dataset.fallback) {
                                        this.dataset.fallback = '1'; 
                                        this.src = '${ORACLE_DOMAIN}/image/${item.img_file_id}';  
                                    } else { 
                                        this.style.display='none'; 
                                    }
                                ">
                        ` : `<div class="card-img bg-slate-700 flex items-center justify-center text-4xl">🔗</div>`}
                        <div class="p-4 flex flex-col flex-1">
                            <h3 class="font-bold text-lg mb-2 line-clamp-2 text-white">${item.title || '无标题'}</h3>
                            <p class="text-sm text-slate-400 mb-4 line-clamp-2">${item.description || '无描述'}</p>
                            <div class="mt-auto flex gap-2">
                                <a href="${item.url}" target="_blank" class="flex-1 text-center bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-sm transition-colors">查看原文</a>
                                <a href="${item.url}" target="_blank" class="inline-flex items-center justify-center bg-orange-600 hover:bg-orange-500 px-3 py-2 rounded-lg text-sm transition-colors" title="下载/打开">⬇️</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("加载列表失败", e);
                cardsContainer.innerHTML = '<p class="text-red-400 col-span-full text-center py-8">加载失败，请刷新重试</p>';
            }
        }

        saveBtn.onclick = async () => {
            const url = urlInput.value.trim();
            if (!url) return alert('请输入链接');

            saveBtn.disabled = true;
            saveBtn.innerText = '提交中...';
            statusText.classList.remove('hidden');
            statusText.innerText = '正在抓取中... 请等待 40 秒';

            try {
                const saveRes = await fetch('/api/save', { method: 'POST', body: JSON.stringify({ url }) });
                const { bookmarkId } = await saveRes.json();

                await sleep(40000);
                
                let checkRes = await fetch(`/api/check-status?id=${bookmarkId}`);
                let checkData = await checkRes.json();

                if (checkData.status !== 'success') {
                    statusText.innerText = '抓取较慢，再等 15 秒...';
                    await sleep(15000);
                    checkRes = await fetch(`/api/check-status?id=${bookmarkId}`);
                    checkData = await checkRes.json();
                }

                if (checkData.status === 'success') {
                    statusText.innerText = '正在将封面图转存至 Telegram...';
                    const { url: targetUrl, title, description, imageUrl, karakeepLocalImage } = checkData.data;
                    let imgFileId = "";

                    if (karakeepLocalImage) {
                        try {
                            const proxyRes = await fetch(`${ORACLE_DOMAIN}/proxy-image?url=${encodeURIComponent(karakeepLocalImage)}`);
                            if (proxyRes.ok) {
                                const proxyData = await proxyRes.json();
                                if (proxyData.success) {
                                    imgFileId = proxyData.file_id;
                                }
                            }
                        } catch (e) {
                            console.error("浏览器请求 Oracle 转存失败", e);
                        }
                    }

                    statusText.innerText = '正在写入数据库...';
                    await fetch('/api/store', {
                        method: 'POST',
                        body: JSON.stringify({ 
                            url: targetUrl, 
                            title, 
                            description, 
                            imageUrl, 
                            imgFileId 
                        })
                    });

                    await loadCards();
                } else {
                    alert("抓取超时，请稍后刷新查看");
                }

            } catch (e) {
                console.error(e);
                alert('保存过程出现异常');
            } finally {
                statusText.classList.add('hidden');
                urlInput.value = '';
                saveBtn.disabled = false;
                saveBtn.innerText = '保存链接';
            }
        };

        loadCards();

        document.getElementById('searchKeyword').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('#cardsContainer .card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(keyword) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
